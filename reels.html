  const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

<style>
  :root{--brand:#08518b;--brand-deep:#052f52}
  *{box-sizing:border-box;margin:0}
  body{background:#0a1622;color:#fff;font-family:"Segoe UI Rounded",system-ui,-apple-system,sans-serif;
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px}
  h1{font-size:18px;font-weight:800;margin-top:6px}
  .sub{font-size:13px;opacity:.7;text-align:center;max-width:34ch;margin-top:-8px}
  .stage{position:relative;width:min(92vw,340px);aspect-ratio:9/16;border-radius:18px;overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.5);background:#000}
  canvas{width:100%;height:100%;display:block}
  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{font-family:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 20px;font-weight:800;font-size:15px}
  .primary{background:var(--brand);color:#fff}
  .primary:hover{background:#0a63a8}
  .ghost{background:rgba(255,255,255,.12);color:#fff}
  .rec{background:#e5484d;color:#fff}
  .status{font-size:13px;opacity:.85;min-height:18px;text-align:center}
  .tips{font-size:12.5px;opacity:.6;max-width:38ch;text-align:center;line-height:1.5}
  a.dl{color:#7ec8ff}

<body>
  <h1>🎬 Gerar vídeo das promoções</h1>
  <p class="sub">Formato Reels/Stories (9:16). Toque em Reproduzir pra pré-visualizar.</p>
  <div class="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
  <div class="controls">
    <button class="primary" onclick="play()">▶️ Reproduzir</button>
    <button class="rec" onclick="record()" id="recBtn">⏺ Gravar vídeo</button>
    <button class="ghost" onclick="location.reload()">↻ Recarregar</button>
  </div>
  <div class="status" id="status">Carregando promoções…</div>
  <p class="tips">💡 No celular: toque em <b>Gravar vídeo</b> → depois em <b>📲 Salvar / Compartilhar</b> (vai direto pro Instagram/galeria, em MP4). No PC: <b>Gravar vídeo</b> → <b>⬇️ Baixar</b>.</p>

<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=1080,H=1920;
const BRAND='#08518b',DEEP='#052f52';
let settings={},promos=[],imgs={},logoImg=null;
const status=m=>document.getElementById('status').textContent=m;

/* ---------- carregar dados ---------- */
function loadImg(src){return new Promise(res=>{if(!src)return res(null);const i=new Image();
  if(!src.startsWith('data:'))i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});}
async function boot(){
  try{
    const [s,pr]=await Promise.all([
      sb.from('settings').select('data').eq('id',1).maybeSingle(),
      sb.from('promos').select('id,data,pos').order('pos',{ascending:true})
    ]);
    settings=(s.data&&s.data.data)||{};
    promos=(pr.data||[]).map(r=>r.data).slice(0,5); // até 5 promos
    if(settings.logo)logoImg=await loadImg(settings.logo);
    for(const p of promos){if(p.img)imgs[p.img]=await loadImg(p.img);}
    if(!promos.length){status('Nenhuma promoção cadastrada.');return;}
    status(`${promos.length} promoção(ões) · duração ~${Math.round(totalDur()/1000)}s`);
    drawFrame(0); // primeiro quadro parado
  }catch(e){status('Erro ao carregar. Veja se há promoções.');console.error(e);}
}

/* ---------- timeline ---------- */
const INTRO=2400, SLIDE=4800, OUTRO=3000, FADE=0.14;
function segments(){
  const segs=[{t:'intro',d:INTRO}];
  promos.forEach(p=>segs.push({t:'promo',d:SLIDE,p}));
  segs.push({t:'outro',d:OUTRO});
  return segs;
}
function totalDur(){return segments().reduce((a,s)=>a+s.d,0);}
const easeOut=t=>1-Math.pow(1-t,3);
const easeBack=t=>{const c=1.70158+1;return 1+ (c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};

/* ---------- desenho ---------- */
function rr(X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function cover(img,w,h,ox,oy,scale){const s=Math.max(w/img.width,h/img.height)*scale;const iw=img.width*s,ih=img.height*s;
  x.drawImage(img,(w-iw)/2+ox,(h-ih)/2+oy,iw,ih);}
function bgBrand(){const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,BRAND);g.addColorStop(1,DEEP);x.fillStyle=g;x.fillRect(0,0,W,H);}
function F(f){x.font=f+' "Segoe UI Rounded",system-ui,sans-serif';}

function drawIntro(t){
  bgBrand();
  // pontos/rotas decorativas
  x.globalAlpha=.5;for(let i=0;i<5;i++){x.strokeStyle='rgba(255,255,255,.25)';x.setLineDash([3,16]);x.lineWidth=3;
    x.beginPath();x.moveTo(-50,300+i*260);x.bezierCurveTo(W*.4,220+i*260,W*.6,420+i*260,W+50,300+i*260);x.stroke();}
  x.setLineDash([]);x.globalAlpha=1;
  const e=easeOut(Math.min(1,t*1.6));
  // logo
  if(logoImg){const sz=520*e,lw=logoImg.width*(sz/logoImg.height);
    x.globalAlpha=e;x.drawImage(logoImg,(W-lw)/2,H/2-560,lw,sz);x.globalAlpha=1;}
  else{x.globalAlpha=e;F('800 130px');x.fillStyle='#fff';x.textAlign='center';x.fillText(settings.name||'JORNADA360',W/2,H/2-260);x.globalAlpha=1;}
  const e2=easeOut(Math.max(0,Math.min(1,(t-.35)*1.8)));
  x.globalAlpha=e2;x.textAlign='center';
  F('800 90px');x.fillStyle='#fff';x.fillText('PROMOÇÕES',W/2,H/2+180);x.fillText('ATIVAS ✈️',W/2,H/2+300);
  x.globalAlpha=1;
}
function drawPromo(t,p){
  const img=imgs[p.img];
  if(img){cover(img,W,H,0,-60*t,1.08+0.14*t);}else bgBrand();
  // véu
  const g=x.createLinearGradient(0,H*.35,0,H);g.addColorStop(0,'rgba(4,20,34,0)');g.addColorStop(.55,'rgba(4,20,34,.55)');g.addColorStop(1,'rgba(4,20,34,.96)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  const g2=x.createLinearGradient(0,0,0,H*.3);g2.addColorStop(0,'rgba(4,20,34,.65)');g2.addColorStop(1,'rgba(4,20,34,0)');
  x.fillStyle=g2;x.fillRect(0,0,W,H*.3);
  // topo: só a logo (o selo foi pra perto do destino, pra não ficar atrás da interface do Stories)
  const eTop=easeOut(Math.min(1,t*2));
  x.globalAlpha=eTop;
  if(logoImg){const sz=175,lw=logoImg.width*(sz/logoImg.height);
    if(settings.logoBg){const pad=16;x.fillStyle=settings.logoBg;rr(W-70-lw-pad*2,80,lw+pad*2,sz+pad*2,20);x.fill();x.drawImage(logoImg,W-70-lw-pad,80+pad,lw,sz);}
    else{x.drawImage(logoImg,W-70-lw,72,lw,sz);}}
  x.globalAlpha=1;
  // destino + infos (sobem)
  const e=easeOut(Math.min(1,Math.max(0,(t-.1)*1.8))),dy=(1-e)*60;
  const yDest=H-620+dy;
  // selo "Aéreo + Hospedagem" logo acima do destino
  x.globalAlpha=e;
  F('700 40px');const pt='✈️ Aéreo + Hospedagem',pw=x.measureText(pt).width+56,py=yDest-190;
  x.fillStyle='rgba(255,255,255,.18)';rr(80,py,pw,74,37);x.fill();
  x.strokeStyle='rgba(255,255,255,.45)';x.lineWidth=2;rr(80,py,pw,74,37);x.stroke();
  x.fillStyle='#fff';x.textAlign='left';x.textBaseline='middle';x.fillText(pt,108,py+38);x.textBaseline='alphabetic';
  x.textAlign='left';x.fillStyle='#fff';
  F('800 120px');x.fillText(p.dest||'',80,yDest);
  F('400 46px');x.fillStyle='rgba(255,255,255,.95)';
  let yy=H-540+dy;
  [['🗓️',p.date],['🛫',(p.origin||'')+' → '+(p.destino||p.dest||'')],['🛏️',(p.nights?p.nights+' noites · ':'')+(p.hotel||'')]].filter(l=>l[1]).forEach(l=>{
    x.fillText(l[0]+'  '+l[1],80,yy);yy+=72;});
  x.globalAlpha=1;
  // preço (pop)
  const ep=easeBack(Math.min(1,Math.max(0,(t-.35)*2)));
  const parts=(p.price||'0,00').split(','),reais=parts[0],cents=','+(parts[1]||'00');
  F('800 120px');const bw=x.measureText(reais).width;
  const boxH=190,bx=70,by=H-90-boxH,boxW=bw+360;
  x.save();x.translate(bx+boxW/2,by+boxH/2);x.scale(ep,ep);x.translate(-(bx+boxW/2),-(by+boxH/2));
  x.fillStyle=BRAND;rr(bx,by,boxW,boxH,28);x.fill();
  x.fillStyle='#fff';x.textAlign='left';
  F('800 40px');x.fillText('R$',bx+40,by+80);
  F('800 34px');x.fillText((p.x||'10')+'x',bx+40,by+130);
  F('800 120px');x.fillText(reais,bx+150,by+130);
  F('800 52px');x.fillText(cents,bx+150+bw+8,by+70);
  F('700 34px');x.fillText('Valor por pessoa',bx+40,by+178);
  x.restore();
  // transição suave (entra e sai do preto) — deixa a troca mais lenta/fluida
  if(t<FADE){x.fillStyle='rgba(4,20,34,'+(1-t/FADE).toFixed(3)+')';x.fillRect(0,0,W,H);}
  else if(t>1-FADE){x.fillStyle='rgba(4,20,34,'+((t-(1-FADE))/FADE).toFixed(3)+')';x.fillRect(0,0,W,H);}
}
function drawOutro(t){
  bgBrand();
  const e=easeOut(Math.min(1,t*1.5));x.globalAlpha=e;x.textAlign='center';
  if(logoImg){const sz=420,lw=logoImg.width*(sz/logoImg.height);x.drawImage(logoImg,(W-lw)/2,H/2-520,lw,sz);}
  F('800 92px');x.fillStyle='#fff';x.fillText('Garanta a sua! 🌎',W/2,H/2-40);
  F('600 52px');x.fillStyle='rgba(255,255,255,.9)';x.fillText('Reserve agora pelo WhatsApp',W/2,H/2+60);
  const wa=(settings.wa||'').replace(/\D/g,'');
  if(wa){F('800 60px');x.fillStyle='#5BE39A';x.fillText('📲 '+settings.wa,W/2,H/2+200);}
  F('700 46px');x.fillStyle='rgba(255,255,255,.8)';x.fillText('jornada360viagens.com.br',W/2,H/2+320);
  x.globalAlpha=1;
  if(t<FADE){x.fillStyle='rgba(4,20,34,'+(1-t/FADE).toFixed(3)+')';x.fillRect(0,0,W,H);}
}
function drawFrame(elapsed){
  const segs=segments();let acc=0,seg=segs[0],local=0;
  for(const s of segs){if(elapsed<acc+s.d){seg=s;local=(elapsed-acc)/s.d;break;}acc+=s.d;}
  if(elapsed>=totalDur()){seg=segs[segs.length-1];local=1;}
  x.clearRect(0,0,W,H);
  if(seg.t==='intro')drawIntro(local);
  else if(seg.t==='promo')drawPromo(local,seg.p);
  else drawOutro(local);
}

/* ---------- play ---------- */
let raf=null,start=0;
function loop(ts){if(!start)start=ts;const el=ts-start;drawFrame(el);
  if(el<totalDur())raf=requestAnimationFrame(loop);else{cancelAnimationFrame(raf);raf=null;}}
function play(){if(!promos.length)return;cancelAnimationFrame(raf);start=0;raf=requestAnimationFrame(loop);}

/* ---------- gravar (MP4 no iPhone / webm no resto) ---------- */
let rec=null;
function pickMime(){
  const c=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  for(const m of c){try{if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;}catch(e){}}
  return '';
}
function record(){
  if(!promos.length)return;
  const rb=document.getElementById('recBtn');
  if(!cv.captureStream||!window.MediaRecorder){status('Este navegador não grava vídeo. Use o Chrome ou o Safari atualizado.');return;}
  const mime=pickMime();
  if(!mime){status('Formato de vídeo não suportado neste aparelho.');return;}
  let stream;try{stream=cv.captureStream(30);}catch(e){status('Não consegui iniciar a gravação.');return;}
  try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:16000000});}
  catch(e){try{rec=new MediaRecorder(stream);}catch(e2){status('Erro ao iniciar a gravação neste aparelho.');return;}}
  const chunks=[];rec.ondataavailable=e=>e.data&&e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{
    const ext=(rec.mimeType||mime).includes('mp4')?'mp4':'webm';
    const blob=new Blob(chunks,{type:(rec.mimeType||mime).split(';')[0]});
    const fname='jornada360-promocoes.'+ext;
    const file=new File([blob],fname,{type:blob.type});
    const url=URL.createObjectURL(blob);
    const box=document.getElementById('status');box.innerHTML='Pronto! ';
    const canShare=navigator.canShare&&navigator.canShare({files:[file]});
    if(canShare){
      const b=document.createElement('button');b.className='primary';b.style.padding='11px 16px';b.style.fontSize='14px';
      b.textContent='📲 Salvar / Compartilhar';
      b.onclick=()=>navigator.share({files:[file],title:'Promoções Jornada360'}).catch(()=>{});
      box.appendChild(b);
    }
    const a=document.createElement('a');a.href=url;a.className='dl';a.style.marginLeft='10px';
    if(canShare){a.target='_blank';a.textContent='▶️ Abrir vídeo';}   // celular: abre pra segurar e salvar
    else{a.download=fname;a.textContent='⬇️ Baixar vídeo';}            // PC: baixa direto
    box.appendChild(a);
    rb.textContent='⏺ Gravar vídeo';rb.disabled=false;
  };
  rb.textContent='● Gravando…';rb.disabled=true;
  start=0;cancelAnimationFrame(raf);
  const t0=performance.now(),total=totalDur();
  try{rec.start()}catch(e){status('Erro ao iniciar: '+e.message);rb.textContent='⏺ Gravar vídeo';rb.disabled=false;return;}
  function recLoop(ts){const el=ts-t0;drawFrame(el);
    status('Gravando… '+Math.min(Math.ceil(total/1000),Math.ceil(el/1000))+'s / '+Math.ceil(total/1000)+'s');
    if(el<total)raf=requestAnimationFrame(recLoop);
    else{try{rec.stop()}catch(e){rb.textContent='⏺ Gravar vídeo';rb.disabled=false;}}
  }
  raf=requestAnimationFrame(recLoop);
}
boot();
</script>
</body>
